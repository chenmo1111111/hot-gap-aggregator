# 这三个是我的研究方向，命中的论文排最前面，按列表顺序分级
priority_topics:
  - name: 单细胞聚类
    match: ["single-cell clustering", "single cell clustering", "scRNA-seq clustering", "cell clustering",
            "cell type identification", "cell type annotation", "cell-type annotation", "subclustering",
            "Leiden", "Louvain", "community detection", "subpopulation", "cell embedding",
            "单细胞", "聚类", "细胞类型"]
  - name: 稀有细胞
    match: ["rare cell", "rare cell type", "rare cell population", "rare subpopulation", "rare population",
            "rare cell identification", "minority cell", "minority class", "class imbalance", "imbalanced",
            "underrepresented", "long-tail", "稀有细胞", "稀有", "罕见细胞"]
  - name: 生物信息
    match: ["bioinformatics", "computational biology", "single-cell analysis", "single-cell RNA sequencing",
            "scRNA-seq", "scATAC", "snRNA", "single-nucleus", "spatial transcriptomics", "multi-omics",
            "multiomics", "cell atlas", "batch effect", "data integration", "trajectory inference",
            "RNA velocity", "生物信息", "转录组", "单细胞测序", "空间转录组"]

# 次级兴趣，命中排在 priority 之后、其它之前
keywords_boost: ["graph neural network", "GNN", "hypergraph", "graph representation", "contrastive learning",
                 "autoencoder", "variational", "foundation model", "self-supervised", "deep learning",
                 "representation learning", "dimensionality reduction", "benchmark", "attention",
                 "图神经网络", "超图", "对比学习", "深度学习", "表示学习", "自监督",
                 "机器学习", "人工智能", "大语言模型", "大模型", "智能体", "图学习", "神经网络"]

arxiv_categories: [q-bio.GN, q-bio.QM, q-bio.MN, cs.LG, stat.ML, cs.AI]
biorxiv: true
biorxiv_categories: [bioinformatics, genomics, "systems biology", "cell biology",
                     "molecular biology", "developmental biology", "cancer biology"]
medrxiv: false
pubmed_journals:
  - {name: Nature, mode: filter}
  - {name: Science, mode: filter}
  - {name: Cell, mode: filter}
  - {name: Nature Methods, mode: filter}
  - {name: Nature Biotechnology, mode: filter}
  - {name: Nature Computational Science, mode: filter}
  - {name: Genome Biology, mode: all}
  - {name: Bioinformatics, mode: all}
  - {name: Nucleic Acids Research, mode: filter}
  - {name: Cell Systems, mode: filter}
  - {name: Nature Communications, mode: filter}
  - {name: Briefings in Bioinformatics, mode: filter}
  - {name: Nature Medicine, mode: filter}

