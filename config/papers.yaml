# 多数中文计算机期刊没有向 Crossref 登记作品，改用刊方公开 RSS。
# 每条 feed 独立失败降级；关键词只用于保留与你方向相关的文章。
cn_journal_feeds:
  - {name: 计算机科学, issn: "1002-137X", discipline: 计算机, mode: filter, url: "https://www.jsjkx.com/CN/rss_dqml_1002-137X.xml"}
  - {name: 计算机工程, issn: "1000-3428", discipline: 计算机, mode: filter, url: "https://www.ecice06.com/CN/rss_dqml_1000-3428.xml"}
  - {name: 计算机研究与发展, issn: "1000-1239", discipline: 计算机, mode: filter, url: "https://crad.ict.ac.cn/rss/current.xml"}
# Nature 系列的 Crossref 元数据常无 abstract；后续可加 Nature RSS 补摘要，本期保留标题。
# 中文期刊向 Crossref 登记元数据通常比英文刊慢。分层时间窗既能保留
# 英文刊的新鲜度，也能避免中文核心因 45 天无登记而长期空白。
crossref_lookback_days: 45
crossref_lookback_days_by_tier:
  中文核心: 365
  英文顶刊: 45

lookback_days: 4
per_subsource_limit: 20
per_tier_limit: 20
total_limit: 60
