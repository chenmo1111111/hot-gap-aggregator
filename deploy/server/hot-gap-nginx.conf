server {
    server_name hot.weixincuotiben.top;

    root /var/www/hot-gap;
    index index.html;

    location = /api/auth-check {
        internal;
        proxy_pass http://127.0.0.1:8787/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        # No trailing slash: FastAPI must receive the /api/... path unchanged.
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /data/ {
        auth_request /api/auth-check;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hot.weixincuotiben.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hot.weixincuotiben.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = hot.weixincuotiben.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name hot.weixincuotiben.top;
    return 404; # managed by Certbot
}
